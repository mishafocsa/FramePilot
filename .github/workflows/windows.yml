name: Windows build and checks

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install build and test dependencies
        run: python -m pip install -e ".[build,dev]"
      - name: Test, build and verify the frozen application
        run: python tools/windows_release.py
      - name: Save Windows checks and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Windows-checks
          path: test-results/windows-release/
          if-no-files-found: warn
          retention-days: 14
      - name: Save the checked Windows ZIP
        uses: actions/upload-artifact@v7
        with:
          name: FramePilot-Windows-x64
          path: |
            dist/FramePilot-*-Windows-x64.zip
            dist/FramePilot-*-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
